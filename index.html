          <div className="section-head">
            <h2>Conversemos</h2>
            <p>Completa el formulario para solicitar un taller, hacer una consulta o colaborar.</p>
          </div>

          <div className="contacto-grid">
            <div>
              {enviado ? (
                <div className="confirm">
                  <strong>Gracias por escribir</strong>
                  Recibí tu mensaje y te contactaré lo antes posible para conversar
                  sobre {form.motivo.toLowerCase()}.
                </div>
              ) : (
                <form onSubmit={handleSubmit}>
                  <input type="hidden" name="_replyto" value={form.correo} />
                  <input type="hidden" name="_subject" value="Nuevo mensaje desde ariana.carreras" />
                  <div className="field">
                    <label htmlFor="nombre">Nombre completo</label>
                    <input id="nombre" name="nombre" type="text" placeholder="Tu nombre"
                      value={form.nombre} onChange={handleChange} required />
                  </div>
                  <div className="field">
                    <label htmlFor="correo">Correo electrónico</label>
                    <input id="correo" name="correo" type="email" placeholder="tucorreo@ejemplo.com"
                      value={form.correo} onChange={handleChange} required />
                  </div>
                  <div className="field">
                    <label htmlFor="red">Instagram u otra red (opcional)</label>
                    <input id="red" name="red" type="text" placeholder="@ariana.carreras"
                      value={form.red} onChange={handleChange} />
                  </div>
                  <div className="field">
                    <label htmlFor="motivo">Motivo</label>
                    <select id="motivo" name="motivo" value={form.motivo} onChange={handleChange}>
                      <option>Solicitar un taller</option>
                      <option>Consulta general</option>
                      <option>Donación o colaboración</option>
                    </select>
                  </div>
                  <div className="field">
                    <label htmlFor="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Cuéntame un poco más..."
                      value={form.mensaje} onChange={handleChange} required />
                  </div>
                  <button className="submit-btn" type="submit" disabled={enviando}>
                    {enviando ? "Enviando..." : "Enviar mensaje"}
                  </button>
                  {error && (
                    <p className="form-error">
                      No se pudo enviar el mensaje. Intenta de nuevo en unos minutos.
                    </p>
                  )}
                </form>
              )}
            </div>

            <div className="donacion">
              <h3>Apoya este trabajo</h3>
              <p>
                Se aceptan donaciones para fortalecer las herramientas y los
                materiales que hacen posible cada taller.
              </p>
              <a className="btn btn-donar" href="#">Donar</a>
            </div>
          </div>
        </div>
      </section>

      <footer className="footer">
        <div className="deco-ring deco-ring-light" style={{ width: 150, height: 150, bottom: -70, left: -50 }} />
        <div className="container footer-row">
          <div>
            <div className="footer-note">© {new Date().getFullYear()} Ariana Carreras Espinosa</div>
            <div className="footer-note footer-handle">@{SOCIAL_HANDLE} en todas las redes</div>
          </div>
          <div className="socials">
            {SOCIALS.map(({ name, href, Icon }) => (
              <a key={name} className="social-badge" href={href} target="_blank" rel="noreferrer" aria-label={name}>
                <Icon />
              </a>
            ))}
          </div>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PerfilProfesional />);
</script>
</body>
</html>
