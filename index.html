<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ariana Carreras Espinosa · Salud Pública</title>
<meta name="description" content="Educación que despierta conciencia. Conciencia que impulsa acción. Talleres de TDAH, salud pública y determinantes sociales, y participación ciudadana." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; scroll-behavior: smooth; }

  .page {
    --bone: #F5F0E6;
    --bone-deep: #ECE4D3;
    --ink: #2B2A22;
    --ink-soft: #5A5749;
    --olive: #6E7350;
    --olive-deep: #454A32;
    --olive-pale: #DCDFC9;
    --clay: #A85D3B;
    --line: rgba(43, 42, 34, 0.14);

    background: var(--bone);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page h1, .page h2, .page h3 {
    font-family: 'Fraunces', serif;
    margin: 0;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .container { max-width: 920px; margin: 0 auto; padding: 0 32px; }
  a { color: inherit; }

  .nav { display: flex; align-items: center; justify-content: space-between; padding: 28px 32px; max-width: 984px; margin: 0 auto; }
  .nav-mark { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; }
  .nav-links { display: flex; gap: 28px; font-size: 14.5px; }
  .nav-links a { text-decoration: none; color: var(--ink-soft); transition: color 0.2s ease; }
  .nav-links a:hover { color: var(--olive-deep); }
  @media (max-width: 620px) { .nav-links { gap: 16px; font-size: 13px; } }

  .hero { padding: 48px 0 88px; }
  .hero-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 56px; align-items: center; }
  .status-row { display: flex; align-items: center; gap: 9px; margin-bottom: 22px; font-size: 14px; color: var(--ink-soft); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--olive); flex-shrink: 0; }
  .hero h1 { font-size: clamp(34px, 5vw, 50px); line-height: 1.12; }
  .hero-sub { margin-top: 22px; max-width: 46ch; color: var(--ink-soft); font-size: 17px; }
  .hero-actions { margin-top: 32px; display: flex; gap: 14px; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 13px 26px; border-radius: 999px; font-size: 14.5px; font-weight: 500; text-decoration: none; cursor: pointer; border: 1px solid transparent; font-family: 'Work Sans', sans-serif; }
  .btn-solid { background: var(--olive-deep); color: var(--bone); }
  .btn-solid:hover { background: var(--ink); }
  .btn-outline { border-color: var(--ink); color: var(--ink); background: transparent; }
  .btn-outline:hover { border-color: var(--olive-deep); color: var(--olive-deep); }

  .badge-wrap { justify-self: center; position: relative; width: 210px; height: 210px; }
  .badge-ring { position: absolute; inset: -14px; border: 1.5px solid var(--olive); border-radius: 50%; }
  .badge { width: 100%; height: 100%; border-radius: 50%; background: var(--olive-deep); color: var(--bone); display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 54px; font-weight: 500; }

  @media (max-width: 720px) {
    .hero-grid { grid-template-columns: 1fr; gap: 40px; }
    .badge-wrap { width: 150px; height: 150px; justify-self: start; }
    .badge { font-size: 40px; }
  }

  .credenciales { padding: 40px 0 56px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .cred-item { font-size: 17px; padding: 6px 0; }
  .cred-item strong { font-weight: 600; }
  .cred-item + .cred-item { margin-top: 2px; }

  .section { padding: 84px 0; }
  .section-head { margin-bottom: 44px; max-width: 60ch; }
  .section-head h2 { font-size: 30px; }
  .section-head p { margin-top: 14px; color: var(--ink-soft); font-size: 16px; }

  .taller { padding: 30px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1.6fr; gap: 28px; }
  .taller:last-child { border-bottom: 1px solid var(--line); }
  .taller h3 { font-size: 21px; line-height: 1.25; }
  .taller p { color: var(--ink-soft); font-size: 15.5px; margin: 0; }
  @media (max-width: 620px) { .taller { grid-template-columns: 1fr; gap: 10px; } }

  .trayectoria-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 48px; }
  .trayectoria-item h3 { font-size: 18px; margin-bottom: 8px; }
  .trayectoria-item p { color: var(--ink-soft); font-size: 15px; margin: 0; }
  @media (max-width: 620px) { .trayectoria-grid { grid-template-columns: 1fr; } }

  .medios-block { background: var(--bone-deep); padding: 44px; border-radius: 6px; }
  .medios-block h3 { font-size: 26px; font-style: italic; font-weight: 500; }
  .medios-block p { margin-top: 16px; color: var(--ink-soft); font-size: 16px; max-width: 62ch; }
  @media (max-width: 620px) { .medios-block { padding: 28px; } }

  .contacto { background: var(--olive-deep); color: var(--bone); padding: 84px 0; }
  .contacto .section-head p { color: var(--olive-pale); }
  .contacto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
  @media (max-width: 720px) { .contacto-grid { grid-template-columns: 1fr; } }

  .field { margin-bottom: 22px; }
  .field label { display: block; font-size: 13.5px; color: var(--olive-pale); margin-bottom: 7px; }
  .field input, .field select, .field textarea { width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(245, 240, 230, 0.35); color: var(--bone); font-family: 'Work Sans', sans-serif; font-size: 15px; padding: 8px 2px; outline: none; }
  .field input::placeholder, .field textarea::placeholder { color: rgba(245, 240, 230, 0.4); }
  .field input:focus, .field select:focus, .field textarea:focus { border-bottom-color: var(--bone); }
  .field select option { color: var(--ink); }
  .field textarea { resize: vertical; min-height: 80px; }

  .submit-btn { background: var(--bone); color: var(--olive-deep); border: none; border-radius: 999px; padding: 13px 28px; font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: 'Work Sans', sans-serif; }
  .submit-btn:hover { background: var(--olive-pale); }

  .confirm { font-size: 16px; line-height: 1.6; max-width: 42ch; }
  .confirm strong { display: block; font-family: 'Fraunces', serif; font-size: 22px; margin-bottom: 10px; font-weight: 600; }

  .donacion { border-top: 1px solid rgba(245, 240, 230, 0.2); padding-top: 28px; }
  .donacion h3 { font-size: 20px; font-weight: 500; }
  .donacion p { color: var(--olive-pale); font-size: 15px; margin: 12px 0 20px; max-width: 42ch; }
  .btn-donar { border: 1px solid var(--bone); color: var(--bone); }
  .btn-donar:hover { background: var(--bone); color: var(--olive-deep); }

  .footer { padding: 40px 0; background: var(--ink); color: var(--bone-deep); }
  .footer-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; font-size: 14px; }
  .socials { display: flex; gap: 12px; }
  .social-badge { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(245, 240, 230, 0.4); display: flex; align-items: center; justify-content: center; color: var(--bone-deep); text-decoration: none; transition: border-color 0.2s ease, color 0.2s ease; }
  .social-badge:hover { border-color: var(--olive); color: var(--bone); }
  .footer-note { opacity: 0.6; font-size: 13px; }
  .footer-handle { margin-top: 4px; }

  @media (prefers-reduced-motion: no-preference) {
    .hero-fade { animation: fadeUp 0.7s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const SOCIAL_HANDLE = "ariana.carreras";
const SOCIAL_LINKS = {
  instagram: `https://instagram.com/${SOCIAL_HANDLE}`,
  facebook: `https://facebook.com/${SOCIAL_HANDLE}`,
  tiktok: `https://tiktok.com/@${SOCIAL_HANDLE}`,
};

function IconInstagram(props) {
  return (
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" strokeWidth="1.6" {...props}>
      <rect x="3" y="3" width="18" height="18" rx="5.5" />
      <circle cx="12" cy="12" r="4.1" />
      <circle cx="17.15" cy="6.85" r="1.05" fill="currentColor" stroke="none" />
    </svg>
  );
}

function IconFacebook(props) {
  return (
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" strokeWidth="1.6" {...props}>
      <circle cx="12" cy="12" r="9" />
      <path
        d="M13.4 20.6v-6.9h2.05l.32-2.55h-2.37V9.5c0-.74.2-1.24 1.26-1.24h1.35V6c-.23-.03-1.02-.1-1.94-.1-1.93 0-3.24 1.18-3.24 3.34v1.9H8.77v2.55h2.06v6.9"
        fill="currentColor"
        stroke="none"
      />
    </svg>
  );
}

function IconTikTok(props) {
  return (
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" strokeWidth="1.6" {...props}>
      <circle cx="12" cy="12" r="9" />
      <path d="M13.2 7.2v7.1a2.65 2.65 0 1 1-1.9-2.54" strokeLinecap="round" />
      <path d="M13.2 7.2c.28 1.52 1.4 2.58 2.85 2.77" strokeLinecap="round" />
    </svg>
  );
}

const SOCIALS = [
  { name: "Instagram", href: SOCIAL_LINKS.instagram, Icon: IconInstagram },
  { name: "Facebook", href: SOCIAL_LINKS.facebook, Icon: IconFacebook },
  { name: "TikTok", href: SOCIAL_LINKS.tiktok, Icon: IconTikTok },
];

function PerfilProfesional() {
  const [form, setForm] = useState({
    nombre: "",
    correo: "",
    red: "",
    motivo: "Solicitar un taller",
    mensaje: "",
  });
  const [enviado, setEnviado] = useState(false);

  function handleChange(e) {
    const { name, value } = e.target;
    setForm((f) => ({ ...f, [name]: value }));
  }

  function handleSubmit(e) {
    e.preventDefault();
    setEnviado(true);
  }

  const talleres = [
    {
      titulo: "TDAH: una mirada desde la salud pública",
      texto:
        "El trastorno por déficit de atención e hiperactividad explicado más allá de lo clínico: su relación con la educación, el empleo y el contexto social a lo largo de la vida.",
    },
    {
      titulo: "Salud pública y determinantes sociales de la salud",
      texto:
        "Marco conceptual de los determinantes sociales y su aplicación práctica al diseño de programas, servicios e intervenciones comunitarias.",
    },
    {
      titulo: "Participación ciudadana y procesos legislativos",
      texto:
        "Cómo incidir en la política pública desde la ciudadanía: seguimiento de medidas, vistas públicas y estrategias de cabildeo con enfoque comunitario.",
    },
  ];

  const trayectoria = [
    {
      titulo: "Análisis de política pública",
      texto:
        "Evaluación de medidas y proyectos relacionados a neurodesarrollo — particularmente TDAH —, vivienda y otros asuntos de bienestar social.",
    },
    {
      titulo: "Radicación de medidas",
      texto:
        "Redacción y acompañamiento en la radicación de propuestas de política pública ante cuerpos legislativos.",
    },
    {
      titulo: "Trabajo voluntario · EducAcción",
      texto:
        "Colaboración sostenida con EducAcción en iniciativas educativas y comunitarias orientadas a la equidad.",
    },
  ];

  return (
    <div className="page">
      <nav className="nav">
        <div className="nav-mark">Ariana Carreras</div>
        <div className="nav-links">
          <a href="#talleres">Talleres</a>
          <a href="#trayectoria">Trayectoria</a>
          <a href="#medios">Medios</a>
          <a href="#contacto">Contacto</a>
        </div>
      </nav>

      <header className="hero" id="inicio">
        <div className="container hero-grid hero-fade">
          <div>
            <div className="status-row">
              <span className="status-dot" />
              Disponible para talleres y colaboraciones
            </div>
            <h1>Educación que despierta conciencia. Conciencia que impulsa acción.</h1>
            <p className="hero-sub">
              Soy Ariana Carreras Espinosa, estudiante doctoral en Salud Pública con
              especialidad en Determinantes Sociales de la Salud. Facilito talleres,
              analizo política pública y acompaño procesos de participación
              ciudadana en Puerto Rico.
            </p>
            <div className="hero-actions">
              <a className="btn btn-solid" href="#contacto">Solicitar un taller</a>
              <a className="btn btn-outline" href="#credenciales">Ver credenciales</a>
            </div>
          </div>
          <div className="badge-wrap">
            <div className="badge-ring" />
            <div className="badge">AC</div>
          </div>
        </div>
      </header>

      <section className="credenciales" id="credenciales">
        <div className="container">
          <div className="cred-item"><strong>Maestría en Ciencias, Salud Pública</strong></div>
          <div className="cred-item">Estudiante doctoral en Salud Pública — especialidad en Determinantes Sociales de la Salud</div>
        </div>
      </section>

      <section className="section" id="talleres">
        <div className="container">
          <div className="section-head">
            <h2>Talleres</h2>
            <p>Espacios de formación diseñados para organizaciones, escuelas y grupos comunitarios.</p>
          </div>
          {talleres.map((t) => (
            <div className="taller" key={t.titulo}>
              <h3>{t.titulo}</h3>
              <p>{t.texto}</p>
            </div>
          ))}
        </div>
      </section>

      <section className="section" id="trayectoria" style={{ paddingTop: 0 }}>
        <div className="container">
          <div className="section-head">
            <h2>Trayectoria</h2>
            <p>Un resumen de en qué he trabajado hasta el momento.</p>
          </div>
          <div className="trayectoria-grid">
            {trayectoria.map((t) => (
              <div className="trayectoria-item" key={t.titulo}>
                <h3>{t.titulo}</h3>
                <p>{t.texto}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section className="section" id="medios" style={{ paddingTop: 0 }}>
        <div className="container">
          <div className="section-head">
            <h2>Participación en medios</h2>
          </div>
          <div className="medios-block">
            <h3>Radio Isla</h3>
            <p>
              Ha participado como invitada para conversar sobre el aniversario del
              11 de septiembre, los procesos legislativos en Puerto Rico y el
              debate público en torno a las vacunas.
            </p>
          </div>
        </div>
      </section>

      <section className="contacto" id="contacto">
        <div className="container">
          <div className="section-head">
            <h2>Conversemos</h2>
            <p>Completa el formulario para solicitar un taller, hacer una consulta o colaborar.</p>
          </div>

          <div className="contacto-grid">
            <div>
              {enviado ? (
                <div className="confirm">
                  <strong>Gracias por escribir</strong>
                  Recibí tu mensaje y te contactaré lo antes posible para conversar
                  sobre {form.motivo.toLowerCase()}.
                </div>
              ) : (
                <form onSubmit={handleSubmit}>
                  <div className="field">
                    <label htmlFor="nombre">Nombre completo</label>
                    <input id="nombre" name="nombre" type="text" placeholder="Tu nombre"
                      value={form.nombre} onChange={handleChange} required />
                  </div>
                  <div className="field">
                    <label htmlFor="correo">Correo electrónico</label>
                    <input id="correo" name="correo" type="email" placeholder="tucorreo@ejemplo.com"
                      value={form.correo} onChange={handleChange} required />
                  </div>
                  <div className="field">
                    <label htmlFor="red">Instagram u otra red (opcional)</label>
                    <input id="red" name="red" type="text" placeholder="@ariana.carreras"
                      value={form.red} onChange={handleChange} />
                  </div>
                  <div className="field">
                    <label htmlFor="motivo">Motivo</label>
                    <select id="motivo" name="motivo" value={form.motivo} onChange={handleChange}>
                      <option>Solicitar un taller</option>
                      <option>Consulta general</option>
                      <option>Donación o colaboración</option>
                    </select>
                  </div>
                  <div className="field">
                    <label htmlFor="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Cuéntame un poco más..."
                      value={form.mensaje} onChange={handleChange} required />
                  </div>
                  <button className="submit-btn" type="submit">Enviar mensaje</button>
                </form>
              )}
            </div>

            <div className="donacion">
              <h3>Apoya este trabajo</h3>
              <p>
                Se aceptan donaciones para fortalecer las herramientas y los
                materiales que hacen posible cada taller.
              </p>
              <a className="btn btn-donar" href="#">Donar</a>
            </div>
          </div>
        </div>
      </section>

      <footer className="footer">
        <div className="container footer-row">
          <div>
            <div className="footer-note">© {new Date().getFullYear()} Ariana Carreras Espinosa</div>
            <div className="footer-note footer-handle">@{SOCIAL_HANDLE} en todas las redes</div>
          </div>
          <div className="socials">
            {SOCIALS.map(({ name, href, Icon }) => (
              <a key={name} className="social-badge" href={href} target="_blank" rel="noreferrer" aria-label={name}>
                <Icon />
              </a>
            ))}
          </div>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PerfilProfesional />);
</script>
</body>
</html>
